# Publishes the phyll package to npm when a version tag is pushed, such as v0.4.2.
# It uses npm trusted publishing: GitHub proves who is publishing, so there is no token to keep
# and the package carries a provenance statement. The tag must match the package version.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: node -e "const v = 'v' + require('./packages/connector/package.json').version; if (v !== process.env.GITHUB_REF_NAME) { console.error(v + ' is not ' + process.env.GITHUB_REF_NAME); process.exit(1) }"
      - run: npm ci
      - run: npm ci
        working-directory: packages/connector
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm publish --access public
        working-directory: packages/connector
